<svg width="820" height="340" viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', monospace; font-size: 18px; }
    .p { fill: #3fb950; }
    .c { fill: #e6edf3; }
    .o { fill: #36BCF7; }
    .m { fill: #f0c674; }
    .l { opacity: 0; animation: show 0.01s forwards; }
    .d1 { animation-delay: 0.4s; } .d2 { animation-delay: 1.2s; }
    .d3 { animation-delay: 2.0s; } .d4 { animation-delay: 2.8s; }
    .d5 { animation-delay: 3.6s; } .d6 { animation-delay: 4.4s; }
    .d7 { animation-delay: 5.2s; } .d8 { animation-delay: 6.0s; }
    .cur { animation: blink 1s steps(1) 6.1s infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect x="1" y="1" width="818" height="338" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
