<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.5" stop-color="#14263a"/>
      <stop offset="1" stop-color="#1b4a5e"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7fdcff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#36BCF7" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeclip">
      <rect x="300" y="170" width="0" height="40">
        <animate attributeName="width" values="0;400;400;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="round"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <!-- garis scan -->
    <rect x="0" y="0" width="1000" height="3" fill="#36BCF7" opacity="0.35">
      <animate attributeName="y" values="0;260;0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- titik melayang -->
    <g fill="#36BCF7">
      <circle cx="80" cy="60" r="2.5" opacity="0.6"><animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="215" r="2" opacity="0.5"><animate attributeName="cy" values="215;195;215" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="35" r="2" opacity="0.5"><animate attributeName="cy" values="35;55;35" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="220" r="3" opacity="0.6"><animate attributeName="cy" values="220;200;220" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="70" r="2.5" opacity="0.5"><animate attributeName="cy" values="70;90;70" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="235" r="1.8" opacity="0.4"><animate attributeName="cy" values="235;220;235" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- jaringan node kanan -->
    <g stroke="#36BCF7" stroke-opacity="0.35" stroke-width="1.2" fill="none">
      <path d="M850 60 L905 105 L870 165 L930 195"/>
      <path d="M905 105 L960 70"/>
      <path d="M870 165 L820 200"/>
    </g>
    <g fill="#36BCF7" filter="url(#glow)">
      <circle cx="850" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="905" cy="105" r="6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="165" r="5"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="195" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="70" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="200" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- perisai + gembok kiri -->
    <g transform="translate(130,128)" filter="url(#glow)">
      <path d="M0,-58 L46,-40 V6 C46,40 18,60 0,70 C-18,60 -46,40 -46,6 V-40 Z" fill="#36BCF7" fill-opacity="0.08" stroke="#36BCF7" stroke-width="3">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
      </path>
      <rect x="-16" y="-8" width="32" height="26" rx="4" fill="#36BCF7"/>
      <path d="M-10,-8 V-18 A10,10 0 0 1 10,-18 V-8" fill="none" stroke="#36BCF7" stroke-width="4"/>
      <circle cx="0" cy="5" r="3.5" fill="#0b0f1a"/>
    </g>

    <!-- judul -->
    <text x="500" y="125" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="5" fill="url(#ttl)" filter="url(#glow)">ANDRE ALFARID</text>

    <!-- subjudul mengetik -->
    <g clip-path="url(#typeclip)">
      <text x="308" y="196" font-family="'Courier New',monospace" font-size="20" fill="#36BCF7">Network Security | Coder | Gamer</text>
    </g>
    <rect y="178" width="10" height="22" fill="#36BCF7">
      <animate attributeName="x" values="308;708;708;308" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="998" height="258" rx="18" fill="none" stroke="#36BCF7" stroke-opacity="0.35"/>
</svg>
